# Jalankan dari folder ini:  docker compose up --build   →  http://localhost:5005
# Folder ini di-mount ke /app: perubahan kode langsung terbaca (Flask debug reload),
# dan perubahan data.json tersimpan di folder ini.
services:
  tiket-event:
    build: .
    ports: ["5005:5000"]
    volumes: [".:/app"]
